name: Update profile
on:
  schedule:
    # 08:23 Asia/Taipei every day.
    - cron: '23 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-profile.yml'
      - 'scripts/**'
      - 'profile.json'
      - 'README.md'
permissions:
  contents: read
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify private metrics import
        run: node --test scripts/update-private.test.mjs
      - name: Refresh counters and artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update.mjs
      - name: Publish changed profile assets
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile.json README.md assets/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh daily GitHub counters'
            git push
          fi
