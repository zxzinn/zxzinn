<svg xmlns="http://www.w3.org/2000/svg" width="590" height="168" viewBox="0 0 590 168" fill="none">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .flow { stroke-dasharray: 3 7; animation: flow 1.6s linear infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  
  @media (prefers-reduced-motion: reduce) { .flow, .blink, .pulse { animation: none; } }
</style>
<rect x="0.5" y="0.5" width="589" height="167" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="24" y="26" width="20" height="18" rx="3" stroke="#8b949e" stroke-width="1.4"/>
<path d="M29 26v18" stroke="#8b949e" stroke-width="1.4"/>
<text x="58" y="40" class="mono" font-size="16" font-weight="600" fill="#e6edf3">opencti-mcp</text>
<text x="566" y="40" class="sans" font-size="20" font-weight="700" fill="#4f8ff7" text-anchor="end">41★ · 20</text>
<text x="566" y="60" class="mono" font-size="11" fill="#8b949e" text-anchor="end">stars · forks</text>
